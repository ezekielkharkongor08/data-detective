[project]
name = "data-detective"
version = "0.1.0"
description = "LangGraph agent that audits a CSV dataset for data quality issues before modeling."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.10.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.1.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "streamlit>=1.35.0",
    "psycopg[binary]>=3.1.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
