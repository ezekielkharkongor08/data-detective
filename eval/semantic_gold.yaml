# Data Detective — column semantic classification gold set.
#
# Hand-labelled expected semantic type for every column of each dataset.
# Labels were assigned from domain knowledge of the datasets; the classifier
# was NOT run on these files to produce them (avoids circular labels).
#
# Hold-out datasets (titanic, house) are sealed: do not run the classifier on
# them until the rules are frozen. Their labels are still filled in here so
# the gold set is complete, but they must not be used to tune thresholds.
#
# Columns:
#   dataset        : short name used in tests
#   path           : CSV path relative to repo root (read-only data/raw)
#   hold_out       : true = sealed until rules are frozen
#   columns        : one entry per column
#     column            : column name
#     dtype             : pandas dtype as read from the CSV
#     samples           : three raw sample values (as strings), for context
#     expected_type     : one of
#       numeric_measurement, numeric_discrete, binary, categorical,
#       ordinal_candidate, datetime, identifier, text, constant, unknown
#     expected_ambiguous: true / false. true = values alone cannot determine
#       the type confidently (e.g. years, small integer codes); the classifier
#       should flag it and await a --semantic-override.

datasets:
  - name: telco
    path: data/raw/Churn.csv
    n_rows: 7043
    n_cols: 21
    hold_out: false
    columns:
      - column: customerID
        dtype: str
        samples: ["7590-VHVEG", "5575-GNVDE", "3668-QPYBK"]
        expected_type: identifier
        expected_ambiguous: false
      - column: gender
        dtype: str
        samples: ["Female", "Male", "Male"]
        expected_type: binary
        expected_ambiguous: false
      - column: SeniorCitizen
        dtype: int64
        samples: ["0", "0", "0"]
        expected_type: binary
        expected_ambiguous: false
      - column: Partner
        dtype: str
        samples: ["Yes", "No", "No"]
        expected_type: binary
        expected_ambiguous: false
      - column: Dependents
        dtype: str
        samples: ["No", "No", "No"]
        expected_type: binary
        expected_ambiguous: false
      - column: tenure
        dtype: int64
        samples: ["1", "34", "2"]
        expected_type: numeric_discrete
        expected_ambiguous: false
      - column: PhoneService
        dtype: str
        samples: ["No", "Yes", "Yes"]
        expected_type: binary
        expected_ambiguous: false
      - column: MultipleLines
        dtype: str
        samples: ["No phone service", "No", "No"]
        expected_type: categorical
        expected_ambiguous: false
      - column: InternetService
        dtype: str
        samples: ["DSL", "DSL", "DSL"]
        expected_type: categorical
        expected_ambiguous: false
      - column: OnlineSecurity
        dtype: str
        samples: ["No", "Yes", "Yes"]
        expected_type: categorical
        expected_ambiguous: false
      - column: OnlineBackup
        dtype: str
        samples: ["Yes", "No", "Yes"]
        expected_type: categorical
        expected_ambiguous: false
      - column: DeviceProtection
        dtype: str
        samples: ["No", "Yes", "No"]
        expected_type: categorical
        expected_ambiguous: false
      - column: TechSupport
        dtype: str
        samples: ["No", "No", "No"]
        expected_type: categorical
        expected_ambiguous: false
      - column: StreamingTV
        dtype: str
        samples: ["No", "No", "No"]
        expected_type: categorical
        expected_ambiguous: false
      - column: StreamingMovies
        dtype: str
        samples: ["No", "No", "No"]
        expected_type: categorical
        expected_ambiguous: false
      - column: Contract
        dtype: str
        samples: ["Month-to-month", "One year", "Month-to-month"]
        expected_type: categorical
        expected_ambiguous: false
      - column: PaperlessBilling
        dtype: str
        samples: ["Yes", "No", "Yes"]
        expected_type: binary
        expected_ambiguous: false
      - column: PaymentMethod
        dtype: str
        samples: ["Electronic check", "Mailed check", "Mailed check"]
        expected_type: categorical
        expected_ambiguous: false
      - column: MonthlyCharges
        dtype: float64
        samples: ["29.85", "56.95", "53.85"]
        expected_type: numeric_measurement
        expected_ambiguous: false
      - column: TotalCharges
        dtype: str
        samples: ["29.85", "1889.5", "108.15"]
        expected_type: numeric_measurement
        expected_ambiguous: false
      - column: Churn
        dtype: str
        samples: ["No", "No", "Yes"]
        expected_type: binary
        expected_ambiguous: false

