# Data Detective — Docker Compose (local demo).
#
# Default (no profile): API + UI on SQLite.
#   docker compose up --build
# With PostgreSQL:
#   DATABASE_URL=... in .env, then: docker compose --profile postgres up --build

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data_detective_uploads:/app/uploads
      - data_detective_plots:/app/plots
      - data_detective_data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATABASE_PATH=/app/data/data_detective.db
      # DATABASE_URL is passed through only when set. An unset/empty value
      # selects SQLite (see src/config.py), so SQLite is the default.
      - DATABASE_URL=${DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16
    profiles:
      - postgres
    volumes:
      - data_detective_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-data_detective}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-data_detective}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  data_detective_uploads:
  data_detective_plots:
  data_detective_data:
  data_detective_db:
